# ============================================================
# Master Configuration - VL-JEPA vs CLIP CCTV Retrieval
# Paths are relative to data.root; override data.root with the
# CAPSTONE_DATA_ROOT env var when deploying to a remote machine.
# ============================================================

data:
  root: "datasets"                     # bundled synthetic RLVS demo videos; override with CAPSTONE_DATA_ROOT for real data
  ucf_crime:
    path: "Anomaly-Detection-Dataset"
    train_split: "Anomaly_Train.txt"
    test_annotations: "Temporal_Anomaly_Annotation_for_Testing_Videos.txt"
    extensions: [".mp4", ".avi"]
    extracted_parts:
      - "Anomaly-Videos-Part-1"
      - "Anomaly-Videos-Part-2"
      - "Anomaly-Videos-Part-3"
      - "Anomaly-Videos-Part-4"
      - "Normal_Videos_for_Event_Recognition"
  ucf_arg:
    path: "cross camera data"
    viewpoints: ["aerial_clips", "ground_clips", "rooftop_clips"]
    classes: ["boxing", "carrying", "clapping", "digging", "jogging",
              "openclosetrunk", "running", "throwing", "walking", "waving"]
  rlvs:
    path: "real life voilence data/Real Life Violence Dataset"
    classes: ["Violence", "NonViolence"]
    extensions: ["*.mp4", "*.avi"]      # MUST include *.avi (49 NonViolence clips are AVI)
  tinyvirat:
    path: "tinyvirat/TinyVIRAT-v2/TinyVIRAT_V2"
    class_map: "class_map.json"
    splits:
      train: "tiny_train_v2.json"
      val: "tiny_val_v2.json"
      test: "tiny_test_v2_public.json"
    max_clips: null                     # set an int to cap clips on constrained hosts

video:
  num_frames: 8
  frame_size: 224
  fps: 30
  decode_backend: "auto"                # auto | decord | opencv

models:
  default: "clip"
  vljepa:
    visual_backbone: "qubvel-hf/vjepa2-vitl-fpc16-256-ssv2"
    # same ViT-L fpc16-256-ssv2 weights as facebook/vjepa2-vitl-fpc16-256-ssv2, but with a
    # transformers-native config.json (model_type: vjepa2); the original facebook repos
    # predate the integration and AutoConfig rejects them
    # facebook/vjepa2-vitb16-224 etc. do not exist on the Hub; official V-JEPA 2
    # checkpoints are facebook/vjepa2-vit{l,h,g}-fpc{16,32,64}-256[/384][-ssv2|-diving48]
    # low-spec: none smaller than ViT-L exists; use --limit on extraction
    text_encoder: "openai/clip-vit-base-patch32"
    align: "truncate"                   # zero-training dim alignment for the V-JEPA2 + CLIP-text fallback
    num_frames: 16                      # V-JEPA 2 tubelet frame count; encoder resamples clips to this
    input_size: 256
    device: "auto"
    batch_size: 4
  clip:
    primary: "openai/clip-vit-base-patch32"
    # low-spec default above; switch primary to "openai/clip-vit-large-patch14" on 16GB+ GPUs
    secondary: "openai/clip-vit-large-patch14"
    default_variant: "primary"
    input_size: 224
    device: "auto"
    batch_size: 16
    video_strategy: "mean_frame_pooling"

retrieval:
  index_type: "FlatIP"                  # FlatIP | IVF | auto (auto -> IVF past auto_ivf_threshold)
  auto_ivf_threshold: 20000
  top_k: 5
  embedding_save_dir: "results/embeddings"
  index_save_dir: "results/indices"

llm:
  model: "google/flan-t5-base"
  # low-spec: google/flan-t5-small | balanced: google/flan-t5-base | full: google/flan-t5-large
  story_model: "Qwen/Qwen2.5-1.5B-Instruct"   # instruction LM for video story narration / Q&A (CPU friendly)
  quantization: "none"                  # none | 4bit | 8bit (bitsandbytes, Linux only)
  max_new_tokens: 512
  temperature: 0.3
  max_input_tokens: 1024
  device: "auto"

evaluation:
  recall_k_values: [1, 5, 10]
  latency_runs: 50
  throughput_batches: 4
  faithfulness_metric: "grounding_score"  # grounding_score | bertscore | both
  hallucination_threshold: 0.5
  max_eval_clips: 500                   # per-dataset cap for retrieval evaluation on constrained hosts
  generalization_max_per_class: 16      # queries sampled per class per viewpoint (H2)

experiment:
  name: "vljepa_vs_clip_cctv"
  seed: 42
  log_wandb: false
  output_dir: "results"
